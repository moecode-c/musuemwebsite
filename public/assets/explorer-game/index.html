<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  border: 0;
  font: inherit;
  vertical-align: baseline;
}
html,
body {
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at 20% 20%, #1b1406 0%, #090703 55%, #050402 100%);
  margin: 0;
  overflow: hidden;
  display: grid;
  place-items: center;
}

canvas {
  width: min(100vw, calc(100vh * 16 / 9));
  height: min(100vh, calc(100vw * 9 / 16));
  max-width: none;
  max-height: none;
  display: block;
  image-rendering: pixelated;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 50% 35%, rgba(255, 230, 180, 0.18), rgba(0, 0, 0, 0.75)),
    radial-gradient(circle at 10% 90%, rgba(120, 70, 25, 0.35), transparent 45%);
  opacity: 0;
  pointer-events: none;
  transition: opacity 160ms ease;
}

.modal-backdrop.is-visible {
  opacity: 1;
  pointer-events: auto;
}

.modal-card {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%) scale(0.98);
  width: min(82vw, 560px);
  padding: 22px 22px 18px;
  background:
    radial-gradient(circle at 20% 15%, rgba(255, 245, 225, 0.9), rgba(245, 224, 185, 0.85) 45%, rgba(223, 191, 140, 0.92) 100%),
    repeating-linear-gradient(8deg, rgba(120, 80, 35, 0.08), rgba(120, 80, 35, 0.08) 6px, rgba(0, 0, 0, 0) 6px, rgba(0, 0, 0, 0) 14px);
  border: 1px solid rgba(120, 80, 35, 0.45);
  border-radius: 16px;
  color: #3d2710;
  font: 15px/1.55 "Palatino Linotype", "Book Antiqua", Palatino, "Times New Roman", serif;
  letter-spacing: 0.2px;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.35);
  opacity: 0;
  pointer-events: none;
  transition: opacity 160ms ease, transform 160ms ease;
}

.modal-card.is-visible {
  opacity: 1;
  pointer-events: auto;
  transform: translate(-50%, -50%) scale(1);
}

.modal-card__title {
  font: 19px/1.2 "Palatino Linotype", "Book Antiqua", Palatino, "Times New Roman", serif;
  color: #7a4b1d;
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.modal-card__text {
  color: #3d2710;
}

.modal-card__footer {
  display: flex;
  justify-content: flex-end;
  margin-top: 12px;
}

.modal-card__close {
  background: linear-gradient(180deg, #e7c680 0%, #c9974b 100%);
  color: #3d2710;
  border: 1px solid rgba(90, 55, 20, 0.35);
  border-radius: 8px;
  padding: 6px 12px;
  cursor: pointer;
  font: 13px/1 "Palatino Linotype", "Book Antiqua", Palatino, "Times New Roman", serif;
  letter-spacing: 0.4px;
}

.modal-card__close:focus-visible {
  outline: 2px solid #7a4b1d;
  outline-offset: 2px;
}
</style>
<canvas></canvas>
<div id="modalBackdrop" class="modal-backdrop" aria-hidden="true"></div>
<div id="infoModal" class="modal-card" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="modal-card__title">Ancient Egypt</div>
  <div class="modal-card__text"></div>
  <div class="modal-card__footer">
    <button class="modal-card__close" type="button">Close</button>
  </div>
</div>
<script src="./data/l_terrain.js"></script>
<script src="./data/l_boats.js"></script>
<script src="./data/l_buldings.js"></script>
<script src="./data/l_characters.js"></script>
<script src="./data/l_New_Layer_4.js"></script>
<script src="./data/collisions.js"></script>
<script src="./js/utils.js"></script>
<script src="./classes/CollisionBlock.js"></script>
<script src="./classes/Player.js"></script>

<script src="./js/index.js"></script>
<script src="./js/eventListeners.js"></script>
